<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Иванов Иван Иванович — Адвокат</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --gold-dark: #8a6a1a;
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1e1e1e;
      --text: #e8e8e8;
      --muted: #6b6b6b;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Фоновые частицы */
    .bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.15) 0%, transparent 70%);
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Карточка */
    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 56px 48px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.08),
        0 20px 60px rgba(0,0,0,0.8),
        0 0 80px rgba(201,168,76,0.04);
      animation: cardIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Декоративная линия сверху */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: 1px;
    }

    /* Аватар / монограмма */
    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: radial-gradient(135deg, #1a1500 0%, #0d0d0d 100%);
      border: 1.5px solid rgba(201,168,76,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 24px rgba(201,168,76,0.12), 0 0 0 6px rgba(201,168,76,0.04);
      animation: avatarPulse 4s ease-in-out infinite;
    }

    @keyframes avatarPulse {
      0%, 100% { box-shadow: 0 0 24px rgba(201,168,76,0.12), 0 0 0 6px rgba(201,168,76,0.04); }
      50%       { box-shadow: 0 0 36px rgba(201,168,76,0.22), 0 0 0 10px rgba(201,168,76,0.07); }
    }

    .avatar-initials {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      user-select: none;
    }

    /* Имя */
    .name {
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.25;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff 0%, var(--gold-light) 40%, var(--gold) 70%, #fff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
      text-shadow: none;
      filter: drop-shadow(0 0 18px rgba(201,168,76,0.35));
    }

    @keyframes shimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* Специализация */
    .role {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.8;
      margin-bottom: 32px;
      font-family: 'Arial', sans-serif;
      font-weight: 400;
    }

    /* Разделитель */
    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 32px;
      opacity: 0.5;
    }

    /* Контакты */
    .contacts {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 36px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      text-decoration: none;
      color: var(--text);
      font-family: 'Arial', sans-serif;
      font-size: 14px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .contact-item:hover {
      border-color: rgba(201,168,76,0.4);
      background: rgba(201,168,76,0.05);
      transform: translateX(4px);
      color: var(--gold-light);
    }

    .contact-item:hover .icon-wrap {
      background: rgba(201,168,76,0.15);
    }

    .icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.25s ease;
    }

    .icon-wrap svg {
      width: 18px;
      height: 18px;
    }

    .contact-label {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .contact-label span:first-child {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .contact-label span:last-child {
      color: inherit;
    }

    /* Кнопка */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 32px;
      border: none;
      border-radius: 14px;
      font-family: 'Arial', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
      background-size: 200% 200%;
      color: #0a0800;
      transition: all 0.3s ease;
      animation: btnReady 0.6s 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes btnReady {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.25) 50%, transparent 100%);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .btn:hover::before {
      transform: translateX(100%);
    }

    .btn:hover {
      background-position: right center;
      box-shadow: 0 8px 32px rgba(201,168,76,0.4), 0 0 0 1px rgba(201,168,76,0.3);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0px) scale(0.98);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Иконки соцсетей */
    .socials {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 28px;
    }

    .social-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--muted);
      transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
    }

    .social-icon svg {
      width: 18px;
      height: 18px;
      transition: transform 0.25s ease;
    }

    .social-icon:hover {
      border-color: rgba(201,168,76,0.5);
      background: rgba(201,168,76,0.08);
      color: var(--gold);
      transform: translateY(-4px) scale(1.1);
      box-shadow: 0 8px 20px rgba(201,168,76,0.2);
    }

    .social-icon:hover svg {
      transform: scale(1.1);
    }

    /* Подпись */
    .footer-text {
      margin-top: 32px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      font-family: 'Arial', sans-serif;
      opacity: 0.5;
    }

    @media (max-width: 520px) {
      .card { padding: 40px 24px 36px; }
    }
  </style>

<script>
  // Генерация фоновых частиц
  const container = document.getElementById('particles');
  const count = 18;

  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    const size = Math.random() * 120 + 40;
    el.style.cssText = `
      width: ${size}px;
      height: ${size}px;
      left: ${Math.random() * 100}%;
      animation-duration: ${Math.random() * 18 + 12}s;
      animation-delay: ${Math.random() * 14}s;
      opacity: 0;
    `;
    container.appendChild(el);
  }

  // Клик по кнопке — пульс
  const btn = document.querySelector('.btn');
  btn.addEventListener('click', function(e) {
    const ripple = document.createElement('span');
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    ripple.style.cssText = `
      position:absolute;
      width:${size}px;height:${size}px;
      left:${e.clientX - rect.left - size/2}px;
      top:${e.clientY - rect.top - size/2}px;
      background:rgba(255,255,255,0.3);
      border-radius:50%;
      transform:scale(0);
      animation:rippleAnim 0.5s linear;
      pointer-events:none;
    `;
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });

  // Стиль анимации ripple
  const style = document.createElement('style');
  style.textContent = `@keyframes rippleAnim { to { transform:scale(2.5); opacity:0; } }`;
  document.head.appendChild(style);
</script>
